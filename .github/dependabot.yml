version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only direct dependencies we consciously chose; libmpv/tauri plugin
    # versions are tightly coupled to the native side.
    allow:
      - dependency-type: direct
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
