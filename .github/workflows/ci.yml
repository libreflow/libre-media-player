name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:consistency
      - run: npm run build
      - run: npm run test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libmpv-dev libmpv2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch native mpv libraries
        run: npm ci && npx tauri-plugin-libmpv-api setup-lib
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  rust-windows:
    # The app only ever ships/runs on Windows (see README: Windows file
    # association via NSIS hooks, the mpv wrapper DLL, winreg-based default
    # apps registration) -- the Linux `rust` job above only validates that
    # the code is portable Rust, it never builds or runs the real target.
    # Several real bugs in this project's history (a native segfault only
    # reproducible on the compiled Windows exe, aid/sid type mismatches
    # only rejected by the native wrapper at runtime) were NOT catchable by
    # a Linux-only CI; this job is the minimum to close that gap for
    # anything a unit test CAN cover without a full GUI run (cargo test
    # covers the windows-only default-apps-settings logic added alongside
    # this job).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch native mpv libraries
        run: npm ci && npx tauri-plugin-libmpv-api setup-lib
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  windows-installer:
    # The NSIS installer is the ONLY artifact actually shipped to users,
    # yet nothing else in CI compiles it: the NSIS hooks (windows/hooks.nsh),
    # the bundle config and the mpv DLL packaging were previously validated
    # only on a maintainer's machine. This job compiles the real installer
    # on every push to main; on PRs it does the same but does not gate the
    # merge (continue-on-error) so packaging experiments don't block code
    # review -- a broken installer on main is always visible though.
    runs-on: windows-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch native mpv libraries
        run: npm ci && npx tauri-plugin-libmpv-api setup-lib
      - name: Build NSIS installer
        run: npx tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
